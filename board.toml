"schema_version" = 2

["board"]
"name" = "marble"
"soc" = "SM7475"
"description" = "Xiaomi Redmi Note 12 Turbo / POCO F5, iOS 27 bring-up as iPhone 16 Pro (iPhone17,1)"
"kit" = "marble"
"soc_source" = "sm7475"
"os_profile" = "iphone-27.0.1-24A446"

["kernel"]
"defconfig" = "marble_ios27_defconfig"
"config_fragments" = ["arch:configs/common.config", "os:configs/ipados.config"]
"archives" = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "build-fileset-release-reference.py --tree . --lto"]
"patch_series" = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series"]

["firmware"]
"config" = "marble"
"dsc" = "Platforms/Xiaomi/marblePkg/marble.dsc"
"fd" = "Build/marblePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
"packages" = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/SoCs/Qualcomm"]

["firmware"."defines"]
"DEVICE_MODEL" = "marble"

# The iOS root goes to UFS partition sda36 (label rootfs2, 25 GiB, 4096-byte LBAs).
["device_tree"]
"source" = "device:dts/marble.dts"
"include_dirs" = ["soc:dts"]

["components"]
"include" = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

["package"]
"unixnu" = "../UniXNU-dev"

["package"."defconfig"]
"iphone-27.0.1-24A446" = "marble_ios27_defconfig"

# ---- payload and boot image (first bring-up values; sources are cited in the comments) ----
["payload"]
"volume" = "MARBLEESP"
"size_mib" = 192
# DarwinBoot is built into the firmware volume (APRIORI.inc), so the loader protocol comes from the firmware.
"loader" = "firmware"
"title" = "marble iOS 27"
# 256 MiB = the "Kernel" region (0xA8000000, 0x10000000) of marble's Mu memory map (MemoryMapLib.c). shennong reached vfs_mountroot with the same size.
# Android's /proc/iomem (marble-pmos logs/live-android/2026-09-24/proc/iomem) shows 0xa7000000-0xdfffffff as System RAM with the same FD range reserved.
"dram_size" = "0x10000000"
"panic_screen" = true
"kernel_args" = ["-v", "serial=3", "debug=0x14e", "cpus=1", "kt_fixed_zones=120", "-no_slto_panic"]

["payload"."adt"]
# A18 Pro, T8140 (iPhone17,1): the hex of the profile's decimal chip_id 33088.
"chip_id" = "8140"
"owned_memory_size" = "0x10000000"
"root_match_volume_uuid" = "C3A4D926-411E-4365-9855-1B66A5CE0263"

["bootimg"]
# The firmware's own device tree is appended: Resources/Configs/marble.toml in uefi-marble has append_dtb = true, FD base 0xA7100000, size 0x300000, header v4.
"append_dtb" = "Resources/DTBs/marble.dtb"
